name: Register RetailFlow Forge app

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retailflow-forge-registration
  cancel-in-progress: false

jobs:
  register:
    name: Register and validate RetailFlow Forge app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.4

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Disable interactive analytics prompt
        run: forge settings set usage-analytics false

      - name: Confirm Atlassian authentication
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge whoami

      - name: Install RetailFlow dependencies
        working-directory: app
        run: npm install

      - name: Register RetailFlow as a personal Forge app
        working-directory: app
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge register --personal --accept-terms retailflow

      - name: Validate registered app
        working-directory: app
        run: forge lint

      - name: Commit registered app ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/manifest.yml app/package.json app/package-lock.json
          git commit -m "Register RetailFlow Forge app and validate manifest"
          git push
