name: Create RetailFlow Forge app

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retailflow-forge-scaffold
  cancel-in-progress: false

jobs:
  scaffold:
    name: Generate and validate Forge app scaffold
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.4

      - name: Install Forge CLI
        run: npm install --global @forge/cli@12

      - name: Disable interactive analytics prompt
        run: forge settings set usage-analytics false

      - name: Confirm Atlassian authentication
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge whoami

      - name: Ensure app directory is unused
        run: |
          if [ -e app/manifest.yml ]; then
            echo "A Forge app already exists in app/. Refusing to overwrite it."
            exit 1
          fi

      - name: Generate RetailFlow Jira issue panel
        run: forge create --template jira-issue-panel-ui-kit --directory app --personal --accept-terms retailflow

      - name: Validate Forge manifest and app
        working-directory: app
        run: forge lint

      - name: Commit generated Forge app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Create RetailFlow Forge Jira issue panel scaffold"
          git push
