name: Forge CLI environment check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-forge-cli:
    name: Check Forge CLI on GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install Atlassian Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Verify Forge CLI
        run: forge --version
