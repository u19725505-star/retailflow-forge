name: Deploy RetailFlow Forge app

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-forge-app.yml"

permissions:
  contents: read

concurrency:
  group: retailflow-forge-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy RetailFlow to Forge development
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.4

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Disable interactive analytics prompt
        run: forge settings set usage-analytics false

      - name: Confirm Atlassian authentication
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge whoami

      - name: Install RetailFlow dependencies
        working-directory: app
        run: npm install

      - name: Deploy RetailFlow to development
        working-directory: app
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge deploy --non-interactive --environment development --approve MAJOR_VERSION_RULE
