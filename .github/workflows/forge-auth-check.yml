name: Forge authentication check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-forge-auth:
    name: Verify Atlassian Forge authentication
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.4

      - name: Install Forge CLI
        run: npm install --global @forge/cli@12

      - name: Disable interactive analytics prompt
        run: forge settings set usage-analytics false

      - name: Verify Atlassian account authentication
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge whoami
